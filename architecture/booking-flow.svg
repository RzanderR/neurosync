<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Booking Flow — Symptom to Confirmed Appointment</text>

  <!-- ============ ACTOR HEADERS ============ -->
  <g>
    <!-- Patient -->
    <rect x="30" y="50" width="160" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="110" y="78" text-anchor="middle" font-weight="700" font-size="14" fill="#1e293b">Patient</text>
    <text x="110" y="96" text-anchor="middle" font-size="11" fill="#64748b">TBI survivor</text>

    <!-- React SPA -->
    <rect x="230" y="50" width="160" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="310" y="78" text-anchor="middle" font-weight="700" font-size="14" fill="#1e293b">React SPA</text>
    <text x="310" y="96" text-anchor="middle" font-size="11" fill="#1d4ed8">ChatView</text>

    <!-- recommend Lambda -->
    <rect x="430" y="50" width="160" height="60" rx="10" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
    <text x="510" y="78" text-anchor="middle" font-weight="700" font-size="14" fill="#1e293b">recommend</text>
    <text x="510" y="96" text-anchor="middle" font-size="11" fill="#9a3412">Lambda</text>

    <!-- Bedrock -->
    <rect x="630" y="50" width="160" height="60" rx="10" fill="#e9d5ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="710" y="78" text-anchor="middle" font-weight="700" font-size="14" fill="#1e293b">Amazon Bedrock</text>
    <text x="710" y="96" text-anchor="middle" font-size="11" fill="#5b21b6">Claude Haiku 4.5</text>

    <!-- schedule Lambda -->
    <rect x="830" y="50" width="160" height="60" rx="10" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
    <text x="910" y="78" text-anchor="middle" font-weight="700" font-size="14" fill="#1e293b">schedule</text>
    <text x="910" y="96" text-anchor="middle" font-size="11" fill="#9a3412">Lambda</text>
  </g>

  <!-- ============ LIFELINES (dashed) ============ -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4">
    <line x1="110" y1="110" x2="110" y2="760"/>
    <line x1="310" y1="110" x2="310" y2="760"/>
    <line x1="510" y1="110" x2="510" y2="760"/>
    <line x1="710" y1="110" x2="710" y2="760"/>
    <line x1="910" y1="110" x2="910" y2="760"/>
  </g>

  <!-- ============ MESSAGES ============ -->

  <!-- 1. Patient → SPA -->
  <text x="210" y="150" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">1. Types symptoms</text>
  <text x="210" y="166" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">"I've had headaches since my concussion"</text>
  <line x1="110" y1="178" x2="310" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. SPA → recommend -->
  <text x="410" y="208" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">2. POST /recommend</text>
  <text x="410" y="224" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">{ patient (insurance, zip), request }</text>
  <line x1="310" y1="236" x2="510" y2="236" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. recommend → Bedrock -->
  <text x="610" y="266" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">3. InvokeModel</text>
  <text x="610" y="282" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">system prompt with 12 providers + patient ctx</text>
  <line x1="510" y1="294" x2="710" y2="294" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- 4. Bedrock → recommend -->
  <text x="610" y="324" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">4. Model response</text>
  <text x="610" y="340" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">{ providerId, reasoning, alternates }</text>
  <line x1="710" y1="352" x2="510" y2="352" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- 5. recommend → SPA -->
  <text x="410" y="382" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">5. Validated JSON</text>
  <text x="410" y="398" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">filtered to known provider IDs</text>
  <line x1="510" y1="410" x2="310" y2="410" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. SPA → Patient -->
  <text x="210" y="440" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">6. Suggests provider</text>
  <text x="210" y="456" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">"I'd suggest Dr. Chen — accepts your Aetna plan"</text>
  <line x1="310" y1="468" x2="110" y2="468" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Section divider -->
  <line x1="50" y1="498" x2="980" y2="498" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="515" y="494" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">─── booking ───</text>

  <!-- 7. Patient → SPA -->
  <text x="210" y="528" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">7. Confirms · picks timeframe</text>
  <line x1="110" y1="544" x2="310" y2="544" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8. SPA → schedule -->
  <text x="610" y="574" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">8. POST /schedule</text>
  <text x="610" y="590" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">{ patient, clinicId, appointmentType, timeframe }</text>
  <line x1="310" y1="602" x2="910" y2="602" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9. schedule → SPA -->
  <text x="610" y="632" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">9. { path: 'A' or 'B', appointment }</text>
  <text x="610" y="648" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">path randomized server-side</text>
  <line x1="910" y1="660" x2="310" y2="660" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 10. SPA → Patient -->
  <text x="210" y="690" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">10. Conveys result</text>
  <text x="210" y="706" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">"You're booked" (A) / "Email draft sent" (B)</text>
  <line x1="310" y1="718" x2="110" y2="718" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 11. Self-message on SPA -->
  <path d="M 310 745 L 380 745 L 380 760 L 313 760" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="385" y="749" font-size="11" fill="#1e293b" font-weight="600">11. Append to Reminders + post confirmation to Inbox</text>

  <!-- Bottom note -->
  <rect x="40" y="780" width="1020" height="32" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="55" y="800" font-size="11" fill="#78350f"><tspan font-weight="700">Path A</tspan> → appointment.confirmationCode + appointmentTime (instant booking).&#160;&#160;<tspan font-weight="700">Path B</tspan> → appointment.emailDraft + status 'in_progress' (handoff to clinic).</text>
</svg>
